<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Cinema — Watch Free Movies & Series Online</title>
<meta name="description" content="Watch 2000+ free movies and classic TV series online. No signup, no fees — public-domain and Creative Commons classics.">
<style>
:root{--gold:#e8b23a;--bg:#0b0b10;--card:#16161f;--txt:#f2f2f5;--mut:#9a9aad}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{position:sticky;top:0;z-index:30;background:rgba(11,11,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid #23232f;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{font-size:24px;font-weight:800;letter-spacing:1px;white-space:nowrap}.logo span{color:var(--gold)}
#q{flex:1;min-width:160px;background:#1c1c28;border:1px solid #2c2c3d;border-radius:24px;color:var(--txt);padding:10px 18px;font-size:15px;outline:none}
#q:focus{border-color:var(--gold)}
select{background:#1c1c28;border:1px solid #2c2c3d;border-radius:20px;color:var(--txt);padding:9px 12px;font-size:14px;outline:none}
.tabs{display:flex;gap:8px;padding:16px 18px 0;justify-content:center}
.tab{background:#1c1c28;border:1px solid #2c2c3d;color:var(--txt);padding:9px 22px;border-radius:22px;cursor:pointer;font-size:15px;font-weight:600}
.tab.on{background:var(--gold);color:#14100a;border-color:var(--gold)}
.hero{margin:18px;border-radius:16px;overflow:hidden;position:relative;min-height:300px;background:#14141d;display:none}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.hero .inner{position:relative;padding:34px 28px;max-width:640px}
.hero h1{font-size:34px;line-height:1.2;margin-bottom:10px}
.hero p{color:#d7d7e0;line-height:1.55;font-size:15px}
.hero .meta{color:var(--gold);font-weight:700;margin-bottom:8px;font-size:14px}
.btn{background:var(--gold);color:#14100a;border:none;font-weight:800;padding:12px 26px;border-radius:24px;cursor:pointer;font-size:16px;margin-top:16px}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid #3a3a4d;margin-left:8px}
.count{text-align:center;color:var(--mut);padding:6px 16px 0;font-size:15px}.count b{color:var(--gold)}
.cats{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px 2px;justify-content:center}
.cat{background:#1c1c28;border:1px solid #2c2c3d;color:var(--txt);padding:7px 15px;border-radius:20px;cursor:pointer;font-size:13.5px}
.cat.on{background:var(--gold);color:#14100a;border-color:var(--gold);font-weight:700}
h2.row{padding:20px 20px 0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px 18px}
.card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s;position:relative}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222;display:block}
.card .t{padding:9px 11px 3px;font-weight:600;font-size:14.5px;line-height:1.3}
.card .m{padding:0 11px 11px;color:var(--mut);font-size:12.5px}
.card .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--gold)}
#more{display:block;margin:6px auto 10px}
footer{text-align:center;color:var(--mut);padding:26px 16px 42px;font-size:13px;line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:50;padding:16px;overflow:auto}
.modal .box{max-width:920px;margin:0 auto}
.modal video{width:100%;max-height:72vh;background:#000;border-radius:10px}
.modal h2{margin:14px 0 4px;font-size:23px}
.modal .meta{color:var(--gold);font-size:14px;margin-bottom:8px;font-weight:600}
.modal .desc{color:#cfcfda;font-size:15px;line-height:1.55}
.x{float:right;background:var(--gold);border:none;color:#14100a;font-weight:700;padding:9px 18px;border-radius:20px;cursor:pointer;font-size:15px}
.detail{display:flex;gap:18px;flex-wrap:wrap}
.detail img{width:180px;border-radius:10px;aspect-ratio:2/3;object-fit:cover;background:#222}
.detail .info{flex:1;min-width:240px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:36px 0;font-size:16px}
.loading{text-align:center;color:var(--mut);padding:60px 0;font-size:17px}
</style>
</head>
<body>
<header>
  <div class="logo">GLOBAL <span>CINEMA</span></div>
  <input id="q" type="search" placeholder="Search movies & series...">
  <select id="sort">
    <option value="pop">Most Popular</option>
    <option value="az">A – Z</option>
    <option value="new">Newest First</option>
    <option value="old">Oldest First</option>
  </select>
</header>
<section class="hero" id="hero">
  <img id="heroImg" alt="">
  <div class="inner">
    <div class="meta" id="heroMeta"></div>
    <h1 id="heroTitle"></h1>
    <p id="heroDesc"></p>
    <button class="btn" id="heroPlay">▶ Watch Now</button>
    <button class="btn ghost" id="heroList">＋ My List</button>
  </div>
</section>
<nav class="tabs">
  <button class="tab on" data-tab="all">All</button>
  <button class="tab" data-tab="movie">Movies</button>
  <button class="tab" data-tab="series">Series</button>
  <button class="tab" data-tab="list">★ My List</button>
  <button class="tab" data-tab="continue">Continue Watching</button>
</nav>
<p class="count" id="count"></p>
<nav class="cats" id="cats"></nav>
<h2 class="row" id="rowTitle" style="display:none"></h2>
<main class="grid" id="grid"><div class="loading">Loading the cinema...</div></main>
<button class="btn" id="more" style="display:none">Load More</button>
<footer>All films on Global Cinema are public-domain or Creative Commons works — free to watch and share, forever.<br>Streams are served by the Internet Archive (archive.org). No signup. No fees.</footer>

<div class="modal" id="detail"><div class="box">
  <button class="x" data-close="detail">✕ Close</button>
  <div class="detail">
    <img id="dImg" alt="">
    <div class="info">
      <h2 id="dTitle"></h2>
      <div class="meta" id="dMeta"></div>
      <p class="desc" id="dDesc"></p>
      <button class="btn" id="dPlay">▶ Watch Now</button>
      <button class="btn ghost" id="dList">＋ My List</button>
    </div>
  </div>
</div></div>

<div class="modal" id="player"><div class="box">
  <button class="x" data-close="player">✕ Close</button>
  <video id="vid" controls playsinline></video>
  <h2 id="pTitle"></h2><div class="meta" id="pMeta"></div>
</div></div>

<script>
let MOVIES = [], cat = 'All', tab = 'all', query = '', sortBy = 'pop', shown = 0;
const PAGE = 48;
const grid = document.getElementById('grid'), catsEl = document.getElementById('cats');
const myList = new Set(JSON.parse(localStorage.getItem('gc_list') || '[]'));
const prog = JSON.parse(localStorage.getItem('gc_prog') || '{}');
const saveList = () => localStorage.setItem('gc_list', JSON.stringify([...myList]));
const saveProg = () => localStorage.setItem('gc_prog', JSON.stringify(prog));
const isSeries = m => m.g === 'TV Series';

fetch('catalog.json').then(r => r.json()).then(data => {
  MOVIES = data;
  document.getElementById('count').innerHTML = '<b>' + MOVIES.length.toLocaleString() + '+</b> movies &amp; series — free forever';
  const genres = ['All', ...new Set(MOVIES.map(m => m.g))];
  genres.forEach(g => {
    const b = document.createElement('button');
    b.className = 'cat' + (g === 'All' ? ' on' : ''); b.textContent = g;
    b.onclick = () => { cat = g; document.querySelectorAll('.cat').forEach(x => x.classList.toggle('on', x.textContent === g)); shown = 0; render(); };
    catsEl.appendChild(b);
  });
  const feat = MOVIES.find(m => m.t === 'Night of the Living Dead') || MOVIES[0];
  const hero = document.getElementById('hero');
  hero.style.display = 'block';
  document.getElementById('heroImg').src = feat.p;
  document.getElementById('heroMeta').textContent = (feat.y ? feat.y + ' · ' : '') + feat.g + ' · ' + feat.m + ' min · ' + feat.l;
  document.getElementById('heroTitle').textContent = feat.t;
  document.getElementById('heroDesc').textContent = feat.d;
  document.getElementById('heroPlay').onclick = () => play(feat);
  document.getElementById('heroList').onclick = ev => toggleList(feat, ev.target);
  render();
}).catch(() => { grid.innerHTML = '<div class="empty">Catalog failed to load. Please refresh.</div>'; });

function filtered() {
  let list = MOVIES.filter(m =>
    (cat === 'All' || m.g === cat) &&
    (tab === 'all' || (tab === 'movie' && !isSeries(m)) || (tab === 'series' && isSeries(m)) ||
     (tab === 'list' && myList.has(m.id)) || (tab === 'continue' && prog[m.id])) &&
    m.t.toLowerCase().includes(query));
  if (sortBy === 'az') list = [...list].sort((a, b) => a.t.localeCompare(b.t));
  if (sortBy === 'new') list = [...list].sort((a, b) => (b.y || 0) - (a.y || 0));
  if (sortBy === 'old') list = [...list].sort((a, b) => (a.y || 9999) - (b.y || 9999));
  return list;
}
function render() {
  const list = filtered();
  const slice = list.slice(0, shown + PAGE); shown = slice.length;
  grid.innerHTML = list.length ? '' : '<div class="empty">Nothing here yet. Try another search or category.</div>';
  slice.forEach(m => {
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = '<img loading="lazy" src="' + m.p + '" alt=""><div class="t"></div>' +
      '<div class="m">' + (m.y ? m.y + ' · ' : '') + m.g + ' · ' + m.m + ' min</div>';
    d.querySelector('.t').textContent = m.t;
    if (prog[m.id] && prog[m.id].pct) {
      const bar = document.createElement('div'); bar.className = 'bar';
      bar.style.width = Math.min(100, prog[m.id].pct) + '%'; d.appendChild(bar);
    }
    d.onclick = () => detail(m);
    grid.appendChild(d);
  });
  document.getElementById('more').style.display = list.length > shown ? 'block' : 'none';
}
document.getElementById('more').onclick = () => render();
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  shown = 0; render();
});
document.getElementById('q').oninput = e => { query = e.target.value.trim().toLowerCase(); shown = 0; render(); };
document.getElementById('sort').onchange = e => { sortBy = e.target.value; shown = 0; render(); };

let current = null;
function detail(m) {
  current = m;
  document.getElementById('dImg').src = m.p;
  document.getElementById('dTitle').textContent = m.t;
  document.getElementById('dMeta').textContent = (m.y ? m.y + ' · ' : '') + m.g + ' · ' + m.m + ' min · ' + m.r + ' · ' + m.l;
  document.getElementById('dDesc').textContent = m.d;
  const lb = document.getElementById('dList');
  lb.textContent = myList.has(m.id) ? '✓ In My List' : '＋ My List';
  lb.onclick = () => { toggleList(m, lb); lb.textContent = myList.has(m.id) ? '✓ In My List' : '＋ My List'; };
  document.getElementById('dPlay').onclick = () => { closeModal('detail'); play(m); };
  document.getElementById('detail').style.display = 'block';
}
function toggleList(m, btn) {
  if (myList.has(m.id)) myList.delete(m.id); else myList.add(m.id);
  saveList();
  if (btn) btn.textContent = myList.has(m.id) ? '✓ In My List' : '＋ My List';
  if (tab === 'list') { shown = 0; render(); }
}
const vid = document.getElementById('vid');
function play(m) {
  current = m;
  document.getElementById('pTitle').textContent = m.t;
  document.getElementById('pMeta').textContent = (m.y ? m.y + ' · ' : '') + m.g + ' · ' + m.m + ' min · ' + m.l;
  vid.src = m.s;
  document.getElementById('player').style.display = 'block';
  vid.onloadedmetadata = () => {
    const p = prog[m.id];
    if (p && p.t > 10 && p.t < vid.duration - 15) vid.currentTime = p.t;
    vid.play().catch(() => {});
  };
}
setInterval(() => {
  if (current && !vid.paused && vid.duration) {
    prog[current.id] = { t: Math.floor(vid.currentTime), pct: Math.round(vid.currentTime / vid.duration * 100) };
    saveProg();
  }
}, 5000);
function closeModal(id) {
  document.getElementById(id).style.display = 'none';
  if (id === 'player') { vid.pause(); vid.removeAttribute('src'); vid.load(); }
}
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeModal(b.dataset.close));
</script>
</body>
</html>
